name: iOS

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild \
            -project PerfectStack.xcodeproj \
            -scheme PerfectStack \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            build

      - name: Test
        run: |
          xcodebuild \
            -project PerfectStack.xcodeproj \
            -scheme PerfectStack \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest' \
            test

