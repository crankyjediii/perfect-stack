name: iOS

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: macos-latest
    env:
      DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData
      APP_NAME: PerfectStack.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build simulator app
        run: |
          xcodebuild \
            -project PerfectStack.xcodeproj \
            -scheme PerfectStack \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app for Appetize
        run: |
          APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products" -type d -name "$APP_NAME" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Unable to find built simulator app"
            exit 1
          fi

          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "artifacts/PerfectStack-simulator.zip"

      - name: Upload Appetize artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerfectStack-simulator-app
          path: artifacts/PerfectStack-simulator.zip
          if-no-files-found: error
